name: CameraLUT

options:
  bundleIdPrefix: com.lige
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  CameraLUT:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lige.cameralut
        PRODUCT_NAME: CameraLUT
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "LUT Cam"
        INFOPLIST_KEY_NSCameraUsageDescription: "需要使用相机来取景和拍摄。"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要访问相册来保存拍好的照片。"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "把拍好的照片和实况照片保存到相册。"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: "NO"

schemes:
  CameraLUT:
    build:
      targets:
        CameraLUT: all
    run:
      config: Release
